# Workflow de seguridad del proveedor (Orca) - PoC AppSec
# Independiente de build.yml (que forma parte del material a analizar).
# Se ejecuta en cada PR hacia develop o main, y manualmente desde la pestaña Actions.

name: Orca Security

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Permisos mínimos: solo lectura del código.
permissions:
  contents: read

env:
  # Variable de repositorio (Settings > Secrets and variables > Actions > Variables)
  PROJECT_KEY: ${{ vars.ORCA_PROJECT_KEY }}

jobs:
  sast:
    name: Orca SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo: necesario para el análisis diferencial del PR

      - name: Escaneo SAST
        uses: orcasecurity/shiftleft-sast-action@v1
        with:
          api_token: ${{ secrets.ORCA_SECURITY_API_TOKEN }}
          project_key: ${{ env.PROJECT_KEY }}
          path: "."
          format: "sarif"
          output: "results/"
          console_output: "cli"   # SAST no acepta "table"

      - name: Guardar resultados SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orca-sast-sarif
          path: results/

  sca:
    name: Orca SCA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17 y cache de Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Resolver dependencias (arbol transitivo)
        run: mvn -B -q dependency:resolve

      - name: Instalar Orca CLI
        run: |
          curl -sfL 'https://raw.githubusercontent.com/orcasecurity/orca-cli/main/install.sh' | sh
          orca-cli --version

      - name: Escaneo SCA
        env:
          ORCA_SECURITY_API_TOKEN: ${{ secrets.ORCA_SECURITY_API_TOKEN }}
        run: >
          orca-cli --project-key "${{ env.PROJECT_KEY }}" sca scan .
          --exceptions-filepath .orca-exceptions.yml
          --format sarif,json
          --output results/
          --console-output=table
          --dependency-tree
          --security-checks vulns,license,malicious

      - name: Guardar resultados SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orca-sca-sarif
          path: results/

  secrets:
    name: Orca Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # obligatorio para escanear los commits del PR

      - name: Escaneo de secretos
        uses: orcasecurity/shiftleft-secrets-action@v1
        with:
          api_token: ${{ secrets.ORCA_SECURITY_API_TOKEN }}
          project_key: ${{ env.PROJECT_KEY }}
          path: "."
          format: "sarif"
          output: "results/"
          console_output: "table"

      - name: Guardar resultados SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orca-secrets-sarif
          path: results/

  dictamen:
    name: Dictamen
    runs-on: ubuntu-latest
    needs: [sast, sca, secrets]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Descargar resultados de los escaneos
        uses: actions/download-artifact@v4
        with:
          path: resultados

      - name: Generar dictamen
        env:
          SAST_RESULT: ${{ needs.sast.result }}
          SCA_RESULT: ${{ needs.sca.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          SBOM_URL: ${{ vars.ORCA_SBOM_URL }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SAST: "30"
          BASE_SECRETS: "10"
          BASE_IAC: "32"
        run: |
          SAST=resultados/orca-sast-sarif/sast.json
          SCA=resultados/orca-sca-sarif/sca.json
          SEC=resultados/orca-secrets-sarif/secrets.json

          leer() { jq -r "$1" "$2" 2>/dev/null || echo "?"; }
          icono() { if [ "$1" = "success" ]; then echo "✅"; else echo "❌"; fi; }

          SAST_NEW=$(leer '.total_findings_count // 0' "$SAST")
          SCA_NEW=$(leer '[.vulnerabilities[]?.vulnerabilities[]? | select(.status_summary.status == "FAILED" or .status_summary.status == "WARNING")] | length' "$SCA")
          SCA_DEBT=$(leer '[.vulnerabilities[]?.vulnerabilities[]? | select(.status_summary.status == "SKIPPED")] | length' "$SCA")
          SEC_NEW=$(leer '(.results.secret_detection.results // []) | length' "$SEC")
          SAST_URL=$(leer '.results_url' "$SAST")
          SCA_URL=$(leer '.results_url' "$SCA")
          SEC_URL=$(leer '.results_url' "$SEC")

          if [ "$SAST_RESULT" = "success" ] && [ "$SCA_RESULT" = "success" ] && [ "$SECRETS_RESULT" = "success" ]; then
            GATE="✅ APROBADA"
          else
            GATE="❌ BLOQUEADA"
          fi

          cat > dictamen.md <<EOF
          ## 🛡️ Dictamen de seguridad – Orca

          **Compuerta: ${GATE}** · commit ${HEAD_SHA:0:7}

          | Análisis | Resultado | Hallazgos nuevos |
          |---|---|---|
          | SAST | $(icono "$SAST_RESULT") | **${SAST_NEW}** vulnerabilidades nuevas |
          | SCA | $(icono "$SCA_RESULT") | **${SCA_NEW}** vulnerabilidades nuevas |
          | Secretos | $(icono "$SECRETS_RESULT") | **${SEC_NEW}** secretos nuevos |

          **Deuda histórica (separada; no bloquea):**
          - SCA: ${SCA_DEBT} CVEs heredados, exceptuados hasta 2026/12/31
          - SAST: ${BASE_SAST} · Secretos: ${BASE_SECRETS} · IaC: ${BASE_IAC} (línea base main @ 2a6cd08)

          **SBOM (CycloneDX, generado y exportable desde Orca):** [abrir en Orca](${SBOM_URL})

          Detalle en Orca: [SAST](${SAST_URL}) · [SCA](${SCA_URL}) · [Secretos](${SEC_URL})
          EOF

          sed -i 's/^          //' dictamen.md
          cat dictamen.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar dictamen en el PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file dictamen.md --edit-last \
            || gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file dictamen.md